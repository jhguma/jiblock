<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>지트리스</title>
<style>html,body{margin:0;height:100%;background:#0b1220;color:#cfe3ff;font-family:sans-serif;display:flex;align-items:center;justify-content:center}a{color:#85f4d3}</style>
</head>
<body>
<p id="msg">지트리스 서버로 이동 중…</p>
<script>
// 현재 게임 주소는 url.txt에 있음(서버가 터널 주소가 바뀔 때 자동 갱신)
(async () => {
  let url = '';
  try {
    const r = await fetch('url.txt?t=' + Date.now(), { cache: 'no-store' });
    url = (await r.text()).trim();
  } catch (e) {}
  if (/^https:\/\/[a-z0-9-]+\.trycloudflare\.com\/?$/.test(url)) {
    location.replace(url);
  } else {
    document.getElementById('msg').textContent = '서버 주소를 불러오지 못했습니다. 잠시 후 새로고침 해주세요.';
  }
})();
</script>
</body>
</html>
